
services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    hostname: mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/mosquitto.password_file:/mosquitto/config/mosquitto.password_file
      - mosquitto_data:/mosquitto/data
      - mosquitto_data:/mosquitto/log
  influxdb:
    image: influxdb:2.8.0
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
      - ./influxdb/config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: change-me-strong
      DOCKER_INFLUXDB_INIT_ORG: home
      DOCKER_INFLUXDB_INIT_BUCKET: air
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: change-me-long-token
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086"]
      interval: 10s
      timeout: 5s
      retries: 20
  telegraf:
    image: telegraf:1.37.1
    container_name: telegraf
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_TOKEN=change-me-long-token
      - MQTT_USERNAME=user
      - MQTT_PASSWORD=password
    # If Telegraf must reach Mosquitto in another compose/project,
    # point it at the broker host/IP in telegraf.conf (see note below).
  grafana:
    image: grafana/grafana-oss:12.3.1-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: change-me-strong
    depends_on:
      influxdb:
        condition: service_healthy
volumes:
  mosquitto_data:
  grafana-data:
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"