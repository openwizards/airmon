[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000

###############################################################################
# GMGSV2
###############################################################################
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["air/+/gmgsv2"]
  qos = 0
  username = "$MQTT_USERNAME"
  password = "$MQTT_PASSWORD"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "air/+/gmgsv2"
    tags = "_/device/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "air_gmgsv2"

    [[inputs.mqtt_consumer.json_v2.field]]  # all these are int
      path = "voc"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "co"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "no2"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "c2h5ch"
      type = "int"

###############################################################################
# MQ131
###############################################################################
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["air/+/mq131"]
  qos = 0
  username = "$MQTT_USERNAME"
  password = "$MQTT_PASSWORD"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "air/+/mq131"
    tags = "_/device/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "air_mq131"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "o3_ppb"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "v"
      type = "float"

###############################################################################
# SPS30
###############################################################################
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics  = ["air/+/sps30"]
  qos = 0
  username = "$MQTT_USERNAME"
  password = "$MQTT_PASSWORD"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "air/+/sps30"
    tags = "_/device/_"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "air_sps30"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mc_1_0"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mc_2_5"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mc_4_0"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mc_10_0"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "typical_particle_size"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ready"
      type = "bool"

###############################################################################
# OUTPUT: InfluxDB v2
###############################################################################
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "home"
  bucket = "air"
